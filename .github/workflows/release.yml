name: Release Draft

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-version:
    name: 校验 Tag 与项目版本
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: 检出 Tag 对应源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 配置 Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: 验证发布流程
        run: node --test scripts/test-release.mjs scripts/test-updater-manifest.mjs

      - name: 检查版本并输出发布信息
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/version.mjs check --tag "$RELEASE_TAG"

  windows:
    name: 构建 Windows 安装包
    needs: validate-version
    uses: ./.github/workflows/windows-installer.yml
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  macos:
    name: 构建 macOS 安装包
    needs: validate-version
    uses: ./.github/workflows/macos-installer.yml
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  publish:
    name: 准备 Release 草稿与安装包附件
    needs: [validate-version, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.validate-version.outputs.tag }}
      RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
      RELEASE_PRERELEASE: ${{ needs.validate-version.outputs.prerelease }}
    steps:
      - name: 检出 Tag 对应源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 配置 Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: 下载 Windows 安装包
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: DevDock-windows-x64-${{ github.run_number }}
          path: artifacts/windows

      - name: 下载 macOS 安装包
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: DevDock-macos-universal-${{ github.run_number }}
          path: artifacts/macos

      - name: 验证产物并上传至草稿
        shell: bash
        run: |
          # 先完整校验 EXE/DMG SHA、更新包、版本与签名，再进行任何 GitHub 操作。
          node scripts/updater-manifest.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --version "$RELEASE_VERSION" \
            --artifacts artifacts \
            --output artifacts/latest.json
          assets=(artifacts/latest.json)
          while IFS= read -r -d '' asset; do
            assets+=("$asset")
          done < <(find artifacts/windows artifacts/macos -type f -print0)

          printf '%s\n' \
            "DevDock $RELEASE_VERSION" \
            '' \
            '- Windows x64：下载 .exe 安装包。' \
            '- macOS Intel / Apple Silicon：下载通用版 .dmg 安装包。' \
            '- .sha256 文件用于核对下载完整性。' \
            '- latest.json 与 .sig 为应用内更新所用；手动公开此草稿后 latest/download 地址才生效。' \
            '' \
            'Windows 当前提供基础工作台，HBuilderX 自动化与 APK/WGT 构建暂未支持。' \
            'Windows 安装包未签名；macOS 使用 ad-hoc 签名，未包含 Apple 公证。' \
            > release-notes.md
          # 优先使用随版本提交的功能说明；旧标签仍沿用通用安装说明。
          if [ -f "docs/release-$RELEASE_TAG.md" ]; then
            cp "docs/release-$RELEASE_TAG.md" release-notes.md
          fi

          # 公开版本不覆盖；失败留下的草稿可在同一 Tag 的重跑中继续上传。
          if state="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>release-query.log)"; then
            if [ "$state" != 'true' ]; then
              printf 'Release 已公开发布，不覆盖已有版本；请使用新版本和 Tag。\n' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "DevDock $RELEASE_TAG" \
              --notes-file release-notes.md
          fi

          gh release upload "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --clobber
          # 始终保留草稿，最后由维护者在 GitHub 手动发布。
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease="$RELEASE_PRERELEASE" \
            --draft=true
