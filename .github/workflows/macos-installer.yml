name: macOS Installer

on:
  # GitHub 缓存按 ref 隔离；默认分支预热后，后续发布标签才可复用编译缓存。
  push:
    branches: [master]
    paths:
      - '.github/workflows/macos-installer.yml'
      - 'src/**'
      - 'src-tauri/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'index.html'
      - 'vite.config.*'
      - 'tsconfig*.json'
  workflow_dispatch:
  workflow_call:
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  # 只取消过时的默认分支预热，不中断发布标签或手动打包。
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

jobs:
  # 与打包并行；调用方的 macos reusable job 仍须等待全部 job 成功才能发布。
  test-macos:
    name: macOS Tests
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 配置项目指定版本的 pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          run_install: false

      - name: 配置 Node.js 22 与依赖缓存
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 校验项目版本
        run: node scripts/version.mjs check

      - name: 测试版本同步工具
        run: node --test scripts/test-version.mjs

      - name: 验证发布流程
        run: node --test scripts/test-release.mjs scripts/test-updater-manifest.mjs

      - name: 配置原生测试 Rust 工具链
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup show active-toolchain
          rustc --version

      - name: 恢复 Rust 测试依赖缓存
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: macos-test
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: 安装锁定版本的项目依赖
        run: pnpm install --frozen-lockfile

      - name: 运行前端测试
        run: pnpm test

      # Git 工作台测试使用临时仓库；其余测试仍串行，避免端口、文件锁等资源竞争。
      - name: 并行运行 Git 工作台测试
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -- backend_git::tests:: --test-threads=4

      - name: 串行运行其余原生测试
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -- --skip backend_git::tests:: --test-threads=1

      - name: 验证 macOS 自动化脚本
        run: |
          bash scripts/test-hbuilderx.sh
          bash scripts/test-terminal.sh
          bash scripts/test-build.sh

  build-macos:
    name: macOS Universal DMG
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: stable
      # 使用 ad-hoc 签名，不要求 Apple Developer 证书或公证凭据。
      APPLE_SIGNING_IDENTITY: '-'

    steps:
      - name: 检查更新签名私钥
        if: github.event_name != 'push' || github.ref != 'refs/heads/master'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY//[[:space:]]/}" ]]; then
            printf '缺少 TAURI_SIGNING_PRIVATE_KEY，请配置 GitHub Actions secret 后重试\n' >&2
            exit 1
          fi

      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 配置项目指定版本的 pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          run_install: false

      - name: 配置 Node.js 22 与依赖缓存
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 校验项目版本
        run: node scripts/version.mjs check

      - name: 配置 Intel 与 Apple Silicon Rust 目标
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add --toolchain stable aarch64-apple-darwin x86_64-apple-darwin
          rustup show active-toolchain
          rustc --version
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            target_lib_dir="$(rustc --print target-libdir --target "$target")"
            if ! compgen -G "$target_lib_dir/libstd-*.rlib" > /dev/null; then
              printf '目标标准库不存在：%s\n' "$target" >&2
              exit 1
            fi
          done
          xcodebuild -version

      - name: 恢复 Rust 通用版依赖缓存
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: macos-universal
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: 安装锁定版本的项目依赖
        run: pnpm install --frozen-lockfile

      - name: 预热通用版编译缓存
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: pnpm exec tauri build --ci --target universal-apple-darwin --no-bundle

      - name: 构建通用版 DMG 安装包
        if: github.event_name != 'push' || github.ref != 'refs/heads/master'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm exec tauri build --ci --target universal-apple-darwin --bundles app,dmg

      - name: 生成安装包 SHA256 校验文件
        if: github.event_name != 'push' || github.ref != 'refs/heads/master'
        run: |
          shopt -s nullglob
          installers=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          if [ "${#installers[@]}" -ne 1 ]; then
            printf '必须存在唯一的 DMG 安装包\n' >&2
            exit 1
          fi
          for installer in "${installers[@]}"; do
            directory="$(dirname "$installer")"
            filename="$(basename "$installer")"
            (cd "$directory" && shasum -a 256 "$filename") > "$installer.sha256"
          done

      - name: 验证 app 更新包与签名
        if: github.event_name != 'push' || github.ref != 'refs/heads/master'
        run: |
          # Tauri 2 的 app 更新归档在 bundle/macos，而非 bundle/dmg。
          archive='src-tauri/target/universal-apple-darwin/release/bundle/macos/DevDock.app.tar.gz'
          if [ ! -s "$archive" ] || [ ! -s "$archive.sig" ] || ! grep -q '[^[:space:]]' "$archive.sig"; then
            printf '缺少有效的 DevDock.app.tar.gz 或非空更新签名 .sig\n' >&2
            exit 1
          fi
          tar -tzf "$archive" > /dev/null

      - name: 上传安装包
        if: github.event_name != 'push' || github.ref != 'refs/heads/master'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: DevDock-macos-universal-${{ github.run_number }}
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg.sha256
            src-tauri/target/universal-apple-darwin/release/bundle/macos/DevDock.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/DevDock.app.tar.gz.sig
          if-no-files-found: error
          overwrite: true
          retention-days: 7
