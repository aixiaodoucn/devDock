[package]
name = "dev-dock"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"

[features]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "dev_dock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
regex = "1"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "NSArray", "NSObject"] }
block2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWindow", "NSResponder", "NSPanel", "NSGraphics", "NSView", "NSScreen", "NSEvent", "NSApplication", "block2"] }

[dev-dependencies]
tempfile = "3"
